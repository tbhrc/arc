name: ARC v0.3.0 Release Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arc-v030-release-finalize.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified ARC v0.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='23071c2a1aba1a0075d784cbc968ee15a1fbc000'
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.3.0 already exists; verifying target only.'
          else
            gh release create v0.3.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title 'ARC v0.3.0 — Safe Harbour' \
              --notes $'ARC v0.3.0 establishes the first formal safe-harbour release contract.\n\nKnown-good target: 23071c2a1aba1a0075d784cbc968ee15a1fbc000\nEstate manifest schema: 1.0\n\nThis release adds non-secret estate export, non-mutating restore planning, bounded GitHub repository reconstruction, recovery boundaries, and Atlas recovery routing. Private files, specialist-system records, credential values, trusted-runtime machine state, databases and derived-memory contents remain with their declared external owners and are not copied into the ARC manifest.'
          fi
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.0" --jq '.object.sha')
          test "$actual" = "$target"
          gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" --json name,tagName,targetCommitish,url
      - name: Remove bounded release workflow
        run: |
          set -euo pipefail
          git config user.name 'David Potgieter'
          git config user.email 'talentbridgedubai@gmail.com'
          git rm .github/workflows/arc-v030-release-finalize.yml
          git commit -m 'Remove temporary ARC v0.3.0 release lane'
          git push origin HEAD:main
