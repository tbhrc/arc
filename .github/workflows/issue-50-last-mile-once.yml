name: Issue 50 last-mile fix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-50-last-mile-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded patch
        run: python scripts/issue50_once.py
      - name: Verify
        run: |
          python scripts/arc.py verify-self
          python -m unittest discover -s tests
          python scripts/arc.py doctor --config profiles/generic-business/arc.example.json --connectors || true
      - name: Commit fix and remove temporary execution files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-50-last-mile-once.yml scripts/issue50_once.py
          git add scripts/arc.py tests/test_issue_50_last_mile.py
          git commit -m "fix: close FolderDesk issue 50 last-mile gaps"
          git push
