name: Reconcile Public ARC Skills

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, tbhrc, arc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read public Skill allowlist
        id: allowlist
        shell: bash
        run: |
          set -euo pipefail
          count="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('profiles/tbhrc-reference/public-skill-export.json').read_text())
          print(len(data['skills']))
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Prepare empty source when nothing is approved for publication
        if: steps.allowlist.outputs.count == '0'
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/arc-public-skill-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"

      - name: Checkout canonical private Skills for approved exports
        if: steps.allowlist.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SKILLS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SKILLS_READ_TOKEN is required only when public-skill-export.json selects one or more private source Skills." >&2
            exit 2
          fi
          source_dir="$RUNNER_TEMP/arc-public-skill-source"
          rm -rf "$source_dir"
          gh repo clone tbhrc/skills "$source_dir" -- --quiet

      - name: Sync allowlisted Skills and verify public boundary
        shell: bash
        run: python3 scripts/sync_public_skills.py --source "$RUNNER_TEMP/arc-public-skill-source" --apply

      - name: Commit deterministic parity update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/skills; then
            echo "Public ARC Skills already in parity."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/skills
          git commit -m "Sync approved public ARC Skills"
          git push origin HEAD:main
