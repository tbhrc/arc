name: Issue 52 client experience once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-52-client-experience-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply client experience patch and regression alignment
        run: |
          python scripts/issue52_client_experience_once.py
          python scripts/issue52_connector_inference_once.py
          python scripts/issue52_test_alignment_once.py
      - name: Verify FolderDesk
        run: |
          python scripts/arc.py verify-self
          python -m unittest discover -s tests
      - name: Commit implementation and remove temporary execution files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-52-client-experience-once.yml scripts/issue52_client_experience_once.py scripts/issue52_connector_inference_once.py scripts/issue52_test_alignment_once.py
          git add README.md BOOTSTRAP.md ATLAS.md AGENTS.md FEATURES.md .github/skills/atlas/SKILL.md scripts/arc.py scripts/seed_foundation.py starter/skills/client-experience/SKILL.md tests/test_foundation.py tests/test_issue_51_client_ux.py tests/test_issue_52_client_experience.py
          git commit -m "feat: make FolderDesk client onboarding business-first (#52)"
          git push
