name: Validate ARC

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python3 -m py_compile scripts/arc.py scripts/package_atlas.py scripts/seed_foundation.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Blank-slate smoke proof
        run: |
          python3 scripts/arc.py onboard --non-interactive --business-name 'ARC CI Business' --owner arc-ci-business --domains 'sales,delivery' --private-files SharePoint --specialist-systems 'HubSpot,Xero' --output /tmp/arc-ci.json
          python3 scripts/seed_foundation.py --config /tmp/arc-ci.json
          python3 scripts/arc.py export --config /tmp/arc-ci.json --output /tmp/arc-estate.json
          python3 scripts/arc.py restore-plan --manifest /tmp/arc-estate.json
          python3 scripts/package_atlas.py
