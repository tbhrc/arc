name: Validate ARC

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository contract
        run: python3 scripts/arc.py verify-self
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
