name: Validate FolderDesk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, self-verify and test
        run: |
          python3 -m py_compile scripts/folderdesk.py scripts/package_atlas.py scripts/seed_foundation.py scripts/sync_public_skills.py scripts/reconcile_tbhrc_reference.py
          python3 scripts/folderdesk.py verify-self
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Single-repo self-contained contract proof
        run: |
          python3 scripts/folderdesk.py onboard --non-interactive --business-name 'FolderDesk CI Business' --owner folderdesk-ci-business --domains 'sales,delivery' --output /tmp/folderdesk-ci.json
          python3 scripts/folderdesk.py plan --config /tmp/folderdesk-ci.json
          python3 scripts/seed_foundation.py --config /tmp/folderdesk-ci.json
          python3 scripts/folderdesk.py export --config /tmp/folderdesk-ci.json --output /tmp/folderdesk-estate.json
          python3 scripts/folderdesk.py restore-plan --manifest /tmp/folderdesk-estate.json
          python3 scripts/package_atlas.py
