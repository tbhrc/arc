# one-shot verification rerun
name: Issue 51 reopened fixes once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-51-reopened-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reopened issue 51 patch
        run: |
          python scripts/issue51_reopened_once.py
          python scripts/issue51_reopened_alignment_once.py
      - name: Verify FolderDesk
        run: |
          python -m py_compile scripts/arc.py scripts/seed_foundation.py
          python scripts/arc.py verify-self
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/arc.py onboard --non-interactive --business-name 'FolderDesk CI Client' --owner folderdesk-ci-client --domains 'admin,ops,sales' --private-files 'Google Drive' --output /tmp/folderdesk-ci.json
          python scripts/arc.py bootstrap --config /tmp/folderdesk-ci.json --dry-run || true
          python scripts/seed_foundation.py --config /tmp/folderdesk-ci.json
          python scripts/arc.py export --config /tmp/folderdesk-ci.json --output /tmp/folderdesk-estate.json
          python scripts/arc.py restore-plan --manifest /tmp/folderdesk-estate.json
      - name: Commit implementation and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-51-reopened-once.yml scripts/issue51_reopened_once.py scripts/issue51_reopened_alignment_once.py
          git add scripts/arc.py scripts/seed_foundation.py README.md BOOTSTRAP.md VERIFY.md FEATURES.md CAPTURE_RECALL.md tests/test_issue_51_reopened_deployment.py tests/test_issue_51_client_ux.py
          git commit -m "fix: harden client deployment and add capture-recall contract (#51)"
          git push
