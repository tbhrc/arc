name: Issue 51 client UX fix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-51-client-ux-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply client feedback patch
        run: python scripts/issue51_once.py
      - name: Verify FolderDesk
        run: |
          python scripts/arc.py verify-self
          python -m unittest discover -s tests
      - name: Rename published releases to FolderDesk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tbhrc/folderdesk/releases/382824108 -X PATCH \
            -f name='FolderDesk v1.0.0 — Blank-Slate Reproduction Proven' \
            -f body='FolderDesk v1.0.0 proves the primary objective: reproduce the human + AI operating ecosystem on a blank non-TBHRC environment, reconnect an external owner, run a real durable workflow, export a non-secret estate snapshot, and recover the FolderDesk-owned operating surface. Published before the public product rename; current product identity is FolderDesk. See #11 and #12.'
          gh api repos/tbhrc/folderdesk/releases/382168819 -X PATCH \
            -f name='FolderDesk v0.3.0 — Safe Harbour' \
            -f body='FolderDesk v0.3.0 establishes the first formal Safe Harbour release contract. Known-good target: 23071c2a1aba1a0075d784cbc968ee15a1fbc000. Estate manifest schema: 1.0. This release adds non-secret estate export, non-mutating restore planning, bounded GitHub repository reconstruction, recovery boundaries, and Atlas recovery routing. Private files, specialist-system records, credential values, trusted-runtime machine state, databases and derived-memory contents remain with their declared external owners and are not copied into the FolderDesk manifest. Published before the public product rename; current product identity is FolderDesk.'
      - name: Commit implementation and remove temporary execution files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-51-client-ux-once.yml scripts/issue51_once.py
          git add README.md BOOTSTRAP.md RELEASES.md scripts/arc.py tests/test_arc.py tests/test_issue_51_client_ux.py
          git commit -m "fix: implement initial FolderDesk client feedback (#51)"
          git push
