# bounded one-shot migration; removes itself after a successful run
name: Solidify FolderDesk v2 once

on:
  push:
    branches: [folderdesk-v2-solidify-baseline]
    paths:
      - .github/workflows/solidify-v2-once.yml
      - scripts/solidify_v2_once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: folderdesk-v2-solidify-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded migration
        run: python3 scripts/solidify_v2_once.py
      - name: Verify migration
        run: |
          python3 -m py_compile scripts/folderdesk.py scripts/seed_foundation.py
          python3 scripts/folderdesk.py verify-self
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit result and remove one-shot migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/solidify_v2_once.py .github/workflows/solidify-v2-once.yml
          git add scripts/folderdesk.py
          git commit -m "Solidify FolderDesk v2 deployment baseline"
          git push origin HEAD:folderdesk-v2-solidify-baseline
